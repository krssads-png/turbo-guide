
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shift Calculator</title>
<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#111;
  color:white;
  padding:20px;
}
.card{
  background:#1c1c1e;
  padding:15px;
  border-radius:14px;
  margin-bottom:12px;
}
input{
  width:100%;
  padding:10px;
  margin-top:5px;
  margin-bottom:10px;
  background:#2c2c2e;
  color:white;
  border:none;
  border-radius:8px;
  box-sizing:border-box;
}
button{
  padding:12px;
  border:none;
  border-radius:10px;
  font-size:16px;
}
.add{
  background:#0a84ff;
  color:white;
  width:100%;
  margin-top:10px;
}
.del{
  background:#ff453a;
  color:white;
  margin-top:10px;
  width:100%;
}
.reset{
  background:#444;
  color:white;
  width:100%;
  margin-top:10px;
}
.small{
  color:#aaa;
  font-size:13px;
}
</style>
</head>
<body>

<h2>Калькулятор смен</h2>

<div class="card">
  <div>Ставка €/ч</div>
  <input id="rate" type="number" step="0.01">

  <div>Доплата % после 23:00</div>
  <input id="bonus" type="number" step="0.01">

  <div>Чаевые €/ч</div>
  <input id="tipsrate" type="number" step="0.01">

  <div class="small">Данные сохраняются автоматически на этом устройстве.</div>
</div>

<div id="shifts"></div>

<button class="add" onclick="addShift()">+ Добавить смену</button>
<button class="reset" onclick="resetData()">Сбросить данные</button>

<div class="card">
  💵 Зарплата: <span id="pay">0</span> €<br>
  🪙 Чаевые: <span id="tips">0</span> €<br>
  🧾 Всего: <span id="total">0</span> €
</div>

<script>
const STORAGE_KEY = "shift_calc_full_v3";

function defaultState(){
  return {
    rate: 13.5,
    bonus: 25,
    tipsrate: 0.5,
    shifts: [
      { start: "16:00", end: "01:00" },
      { start: "19:00", end: "04:00" },
      { start: "19:00", end: "01:00" }
    ]
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.shifts)) return defaultState();
    return parsed;
  }catch(e){
    return defaultState();
  }
}

let state = loadState();

function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function addShift(){
  state.shifts.push({ start:"19:00", end:"01:00" });
  saveState();
  render();
}

function delShift(i){
  state.shifts.splice(i,1);
  saveState();
  render();
}

function resetData(){
  localStorage.removeItem(STORAGE_KEY);
  state = defaultState();
  render();
}

function minutes(t){
  const p = String(t).split(":");
  return parseInt(p[0],10)*60 + parseInt(p[1],10);
}

function changeStart(i,v){
  state.shifts[i].start = v;
  saveState();
  calc();
}

function changeEnd(i,v){
  state.shifts[i].end = v;
  saveState();
  calc();
}

function render(){
  document.getElementById("rate").value = state.rate;
  document.getElementById("bonus").value = state.bonus;
  document.getElementById("tipsrate").value = state.tipsrate;

  let s = document.getElementById("shifts");
  s.innerHTML = "";

  state.shifts.forEach((sh,i) => {
    s.innerHTML += `
      <div class="card">
        Начало
        <input type="time" value="${sh.start}" onchange="changeStart(${i},this.value)">
        Конец
        <input type="time" value="${sh.end}" onchange="changeEnd(${i},this.value)">
        <button class="del" onclick="delShift(${i})">Удалить</button>
      </div>
    `;
  });

  calc();
}

function calc(){
  const rateValue = parseFloat(document.getElementById("rate").value) || 0;
  const bonusValue = parseFloat(document.getElementById("bonus").value) || 0;
  const tipsRateValue = parseFloat(document.getElementById("tipsrate").value) || 0;

  state.rate = rateValue;
  state.bonus = bonusValue;
  state.tipsrate = tipsRateValue;

  const nightRate = rateValue * (1 + bonusValue / 100);

  let pay = 0;
  let tips = 0;

  state.shifts.forEach(sh => {
    let s = minutes(sh.start);
    let e = minutes(sh.end);

    if(e < s) e += 1440;

    const hours = (e - s) / 60;
    let night = 0;

    if(s < 1380 && e > 1380){
      night += (Math.min(e,1440) - Math.max(s,1380)) / 60;
    }

    if(e > 1440){
      night += (e - 1440) / 60;
    }

    const normal = hours - night;

    pay += normal * rateValue + night * nightRate;
    tips += hours * tipsRateValue;
  });

  document.getElementById("pay").innerText = pay.toFixed(2);
  document.getElementById("tips").innerText = tips.toFixed(2);
  document.getElementById("total").innerText = (pay + tips).toFixed(2);

  saveState();
}

document.addEventListener("input", function(e){
  if(
    e.target.id === "rate" ||
    e.target.id === "bonus" ||
    e.target.id === "tipsrate"
  ){
    calc();
  }
});

render();
</script>

</body>
</html>
