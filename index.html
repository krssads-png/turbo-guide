
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shift Calculator</title>

<style>

body{
font-family:-apple-system;
background:#111;
color:white;
padding:20px;
}

.card{
background:#1c1c1e;
padding:15px;
border-radius:14px;
margin-bottom:12px;
}

input{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:10px;
background:#2c2c2e;
color:white;
border:none;
border-radius:8px;
}

button{
padding:10px;
border:none;
border-radius:10px;
font-size:16px;
}

.add{
background:#0a84ff;
color:white;
width:100%;
margin-top:10px;
}

.del{
background:#ff453a;
color:white;
margin-top:10px;
width:100%;
}

</style>
</head>

<body>

<h2>Калькулятор смен</h2>

<div class="card">

Ставка €/ч
<input id="rate" value="13.5">

Доплата % после 23:00
<input id="bonus" value="25">

Чаевые €/ч
<input id="tipsrate" value="0.5">

</div>

<div id="shifts"></div>

<button class="add" onclick="addShift()">+ Добавить смену</button>

<div class="card">

💵 Зарплата: <span id="pay">0</span> €<br>
🪙 Чаевые: <span id="tips">0</span> €<br>
🧾 Всего: <span id="total">0</span> €

</div>

<script>

let shifts = JSON.parse(localStorage.getItem("shifts") || "[]")

if(shifts.length==0){
shifts=[
{start:"16:00",end:"01:00"},
{start:"19:00",end:"04:00"},
{start:"19:00",end:"01:00"}
]
}

function save(){
localStorage.setItem("shifts",JSON.stringify(shifts))
}

function addShift(){

shifts.push({start:"19:00",end:"01:00"})
save()
render()

}

function delShift(i){

shifts.splice(i,1)
save()
render()

}

function minutes(t){

let p=t.split(":")
return p[0]*60+parseInt(p[1])

}

function render(){

let s=document.getElementById("shifts")
s.innerHTML=""

shifts.forEach((sh,i)=>{

s.innerHTML+=`

<div class="card">

Начало
<input type="time" value="${sh.start}" onchange="changeStart(${i},this.value)">

Конец
<input type="time" value="${sh.end}" onchange="changeEnd(${i},this.value)">

<button class="del" onclick="delShift(${i})">Удалить</button>

</div>

`

})

calc()

}

function changeStart(i,v){
shifts[i].start=v
save()
calc()
}

function changeEnd(i,v){
shifts[i].end=v
save()
calc()
}

function calc(){

let rate=parseFloat(rate.value)
let bonus=parseFloat(bonus.value)
let tipsrate=parseFloat(tipsrate.value)

localStorage.setItem("rate",rate)
localStorage.setItem("bonus",bonus)
localStorage.setItem("tipsrate",tipsrate)

let nightRate=rate*(1+bonus/100)

let pay=0
let tips=0

shifts.forEach(sh=>{

let s=minutes(sh.start)
let e=minutes(sh.end)

if(e<s)e+=1440

let hours=(e-s)/60

let night=0

if(s<1380 && e>1380){

night+=(Math.min(e,1440)-Math.max(s,1380))/60

}

if(e>1440){

night+=(e-1440)/60

}

let normal=hours-night

pay+=normal*rate+night*nightRate
tips+=hours*tipsrate

})

document.getElementById("pay").innerText=pay.toFixed(2)
document.getElementById("tips").innerText=tips.toFixed(2)
document.getElementById("total").innerText=(pay+tips).toFixed(2)

}

document.addEventListener("input",calc)

rate.value=localStorage.getItem("rate")||13.5
bonus.value=localStorage.getItem("bonus")||25
tipsrate.value=localStorage.getItem("tipsrate")||0.5

render()

</script>

</body>
</html>
